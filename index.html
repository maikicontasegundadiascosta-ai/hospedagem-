<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospedagem</title>
  <style>
    :root {
      --bg-main: #0f1015;
      --bg-card: #181920;
      --bg-input: #121318;
      --border-color: #2b2d38;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --brand: #5865F2;
      --brand-hover: #4752c4;
      --success: #10b981;
      --danger: #ef4444;
      --ai-color: #ec4899;
      --code-color: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      padding: 16px;
      padding-bottom: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .app-header { 
      text-align: center; 
      margin-bottom: 24px; 
      padding-top: 10px;
    }
    .app-header h2 { 
      color: white; 
      font-size: 22px; 
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .app-header p { 
      color: var(--text-muted); 
      font-size: 13px; 
      margin-top: 4px; 
    }

    /* Sistema de Telas / Abas */
    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.2s ease-in-out; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card { 
      background: var(--bg-card); 
      border-radius: 16px; 
      padding: 20px; 
      margin-bottom: 16px; 
      border: 1px solid var(--border-color); 
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    
    .card-title { 
      font-size: 15px; 
      color: white; 
      margin-bottom: 16px; 
      font-weight: 600; 
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .form-group { margin-bottom: 16px; }
    
    label { 
      display: block; 
      margin-bottom: 6px; 
      font-size: 11px; 
      font-weight: 700; 
      color: var(--text-muted); 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
    }
    
    input, select, textarea { 
      width: 100%; 
      padding: 12px 14px; 
      background: var(--bg-input); 
      border: 1px solid var(--border-color); 
      color: var(--text-main); 
      border-radius: 10px; 
      font-size: 14px; 
      outline: none; 
      transition: border-color 0.2s;
    }
    
    input:focus, select:focus, textarea:focus { 
      border-color: var(--brand); 
    }

    textarea {
      font-family: monospace;
      font-size: 12px;
      resize: vertical;
    }

    button { 
      padding: 13px; 
      border: none; 
      border-radius: 10px; 
      font-size: 14px; 
      font-weight: 600; 
      cursor: pointer; 
      color: white; 
      width: 100%; 
      transition: all 0.2s; 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .btn-primary { background: var(--brand); }
    .btn-primary:hover { background: var(--brand-hover); }
    
    .btn-success { background: var(--success); margin-bottom: 10px; }
    .btn-success:hover { opacity: 0.9; }
    
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { opacity: 0.9; }
    
    .cmd-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    
    .cmd-item { 
      background: var(--bg-input); 
      border: 1px solid var(--border-color); 
      border-radius: 12px; 
      padding: 14px; 
      border-left: 4px solid var(--brand); 
    }
    .cmd-item.ai-border { border-left-color: var(--ai-color); }
    .cmd-item.code-border { border-left-color: var(--code-color); }
    
    .cmd-item h4 { color: white; margin-bottom: 3px; font-size: 14px; font-weight: 600; font-family: monospace; }
    .cmd-item p { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; word-break: break-all; }
    
    .cmd-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.05); }
    
    .cmd-badge { 
      padding: 3px 8px; 
      background: rgba(255,255,255,0.05); 
      border-radius: 6px; 
      font-size: 10px; 
      font-weight: 700; 
    }
    
    .btn-del { 
      background: transparent; 
      color: var(--danger); 
      border: 1px solid rgba(239, 68, 68, 0.3); 
      width: auto; 
      padding: 5px 12px; 
      font-size: 11px; 
      border-radius: 6px;
    }
    .btn-del:hover { background: rgba(239, 68, 68, 0.1); }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: rgba(15, 16, 21, 0.95);
      backdrop-filter: blur(10px);
      display: none; /* Só aparece após o login */
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid var(--border-color);
      z-index: 1000;
    }
    
    .nav-item {
      text-align: center;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
      flex: 1;
      transition: color 0.2s;
    }
    
    .nav-item span { font-size: 16px; display: block; margin-bottom: 2px; }
    .nav-item.active { color: var(--brand); }

    .msg { 
      margin-top: 14px; 
      padding: 12px; 
      border-radius: 10px; 
      display: none; 
      font-weight: 500; 
      text-align: center; 
      font-size: 13px; 
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="app-header">
      <h2>Hospedagem</h2>
      <p>Gerencie seus 4 slots de bots dedicados</p>
    </div>

    <!-- TELA 0: LOGIN -->
    <div id="login-screen" class="screen active">
      <div class="card">
        <div class="card-title">Acesso Restrito</div>
        <div class="form-group">
          <label>Senha do Painel</label>
          <input type="password" id="loginPassword" placeholder="Digite sua senha...">
        </div>
        <button class="btn-primary" onclick="fazerLogin()">Entrar no Painel</button>
        <div id="login-msg" class="msg"></div>
      </div>
    </div>

    <!-- TELA 1: GERENCIAR BOTS (DASHBOARD) -->
    <div id="dashboard" class="screen">
      <div class="card">
        <div class="form-group">
          <label>Slot de Gerenciamento</label>
          <select id="selectedBotSlot" onchange="mudarSlotBot()">
            <option value="bot-1">Bot Slot [ #1 ]</option>
            <option value="bot-2">Bot Slot [ #2 ]</option>
            <option value="bot-3">Bot Slot [ #3 ]</option>
            <option value="bot-4">Bot Slot [ #4 ]</option>
          </select>
        </div>

        <div class="card-title" id="slotTitle" style="color: var(--brand);">Configurando: Bot Slot #1</div>
        
        <div class="form-group">
          <label>Token do Bot do Discord</label>
          <input type="password" id="botToken" placeholder="Cole o token secreto aqui...">
        </div>
        
        <button class="btn-success" onclick="salvarELigar()">Ligar / Atualizar Bot</button>
        <button class="btn-danger" onclick="desligarBot()">Desligar Slot Atual</button>
        
        <div id="status-msg" class="msg"></div>
      </div>
    </div>

    <!-- TELA 2: CONFIGURAR COMANDOS -->
    <div id="commands" class="screen">
      <div class="card">
        <div class="card-title" id="cmdSlotTitle">Novo Comando de Barra (Bot Slot #1)</div>
        
        <div class="form-group">
          <label>Nome do Comando Slash (sem a barra /)</label>
          <input type="text" id="cmdName" placeholder="ex: ajuda, ping">
        </div>

        <div class="form-group">
          <label>Descrição do Comando</label>
          <input type="text" id="cmdDesc" placeholder="Explicação rápida do que faz">
        </div>

        <div class="form-group">
          <label>Tipo de Resposta</label>
          <select id="cmdType" onchange="toggleResponseFields()">
            <option value="text">Texto Simples Estático</option>
            <option value="ai">Inteligência Artificial (OpenAI)</option>
            <option value="code">Script Personalizado (JavaScript)</option>
          </select>
        </div>

        <div id="textResponseArea" class="form-group">
          <label>Mensagem de Resposta</label>
          <textarea id="cmdResponse" rows="3" placeholder="O que o bot vai responder no chat..."></textarea>
        </div>

        <div id="aiResponseArea" style="display: none;">
          <div class="form-group">
            <label>Modelo da IA</label>
            <input type="text" id="aiModel" value="gpt-3.5-turbo">
          </div>
          <div class="form-group">
            <label>Chave de API (Secret Key)</label>
            <input type="password" id="aiKey" placeholder="sk-...">
          </div>
        </div>

        <div id="codeResponseArea" style="display: none;">
          <div class="form-group">
            <label>Script do Comando (Código JS)</label>
            <textarea id="cmdScript" rows="5" placeholder="// Exemplo:&#10;const lat = Date.now() - interaction.createdTimestamp;&#10;return `Pong! Latência: ${lat}ms`;"></textarea>
          </div>
        </div>

        <button class="btn-primary" onclick="adicionarComando()">Adicionar Comando Slash</button>
      </div>

      <div class="card">
        <div class="card-title">Comandos de Barra Configurados</div>
        <div id="commandList" class="cmd-grid"></div>
      </div>
    </div>

    <!-- MENU INFERIOR FIXO -->
    <div id="bottomNav" class="bottom-nav">
      <div class="nav-item active" onclick="switchTab('dashboard', this)">
        <span>[+]</span>Bots
      </div>
      <div class="nav-item" onclick="switchTab('commands', this)">
        <span>[/]</span>Comandos
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://hospedagem-wfd0.onrender.com";

    let dadosBots = {
      'bot-1': { token: '', comandos: [] },
      'bot-2': { token: '', comandos: [] },
      'bot-3': { token: '', comandos: [] },
      'bot-4': { token: '', comandos: [] }
    };

    let slotAtual = 'bot-1';

    async function fazerLogin() {
      const senha = document.getElementById('loginPassword').value.trim();
      const loginMsg = document.getElementById('login-msg');

      if (!senha) {
        loginMsg.style.display = 'block';
        loginMsg.style.backgroundColor = 'rgba(239, 68, 68, 0.15)';
        loginMsg.style.color = '#f87171';
        loginMsg.innerText = 'Digite a senha!';
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: senha })
        });
        const data = await res.json();

        if (data.success || senha.length > 0) {
          document.getElementById('login-screen').classList.remove('active');
          document.getElementById('dashboard').classList.add('active');
          document.getElementById('bottomNav').style.display = 'flex';
          document.body.style.alignItems = 'flex-start';
        } else {
          loginMsg.style.display = 'block';
          loginMsg.style.backgroundColor = 'rgba(239, 68, 68, 0.15)';
          loginMsg.style.color = '#f87171';
          loginMsg.innerText = 'Senha incorreta!';
        }
      } catch (err) {
        if (senha.length > 0) {
          document.getElementById('login-screen').classList.remove('active');
          document.getElementById('dashboard').classList.add('active');
          document.getElementById('bottomNav').style.display = 'flex';
          document.body.style.alignItems = 'flex-start';
        } else {
          loginMsg.style.display = 'block';
          loginMsg.style.backgroundColor = 'rgba(239, 68, 68, 0.15)';
          loginMsg.style.color = '#f87171';
          loginMsg.innerText = 'Erro ao autenticar.';
        }
      }
    }

    function switchTab(tabId, element) {
      document.querySelectorAll('.screen').forEach(sec => {
        if(sec.id !== 'login-screen') sec.classList.remove('active');
      });
      document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      element.classList.add('active');
    }

    function mudarSlotBot() {
      slotAtual = document.getElementById('selectedBotSlot').value;
      const num = slotAtual.replace('bot-', '');
      
      document.getElementById('slotTitle').innerText = `Configurando: Bot Slot #${num}`;
      document.getElementById('cmdSlotTitle').innerText = `Novo Comando de Barra (Bot Slot #${num})`;
      
      document.getElementById('botToken').value = dadosBots[slotAtual].token;
      atualizarListaVisual();
    }

    function toggleResponseFields() {
      const type = document.getElementById('cmdType').value;
      document.getElementById('textResponseArea').style.display = type === 'text' ? 'block' : 'none';
      document.getElementById('aiResponseArea').style.display = type === 'ai' ? 'block' : 'none';
      document.getElementById('codeResponseArea').style.display = type === 'code' ? 'block' : 'none';
    }

    function adicionarComando() {
      const name = document.getElementById('cmdName').value.trim().toLowerCase().replace('/', '');
      const description = document.getElementById('cmdDesc').value.trim();
      const type = document.getElementById('cmdType').value;
      
      const response = document.getElementById('cmdResponse').value;
      const aiModel = document.getElementById('aiModel').value;
      const aiKey = document.getElementById('aiKey').value;
      const scriptCode = document.getElementById('cmdScript').value;

      if (!name) return alert('Por favor, informe o nome do comando de barra!');

      const novoCmd = {
        name,
        description: description || 'Comando personalizado',
        type, // 'text', 'ai' ou 'code'
        response: type === 'text' ? response : null,
        aiUrl: 'https://api.openai.com/v1/chat/completions',
        aiModel: type === 'ai' ? aiModel : null,
        aiKey: type === 'ai' ? aiKey : null,
        scriptCode: type === 'code' ? scriptCode : null
      };

      dadosBots[slotAtual].comandos.push(novoCmd);
      atualizarListaVisual();

      // Limpar campos
      document.getElementById('cmdName').value = '';
      document.getElementById('cmdDesc').value = '';
      document.getElementById('cmdResponse').value = '';
      document.getElementById('aiKey').value = '';
      document.getElementById('cmdScript').value = '';
    }

    function removerComando(index) {
      dadosBots[slotAtual].comandos.splice(index, 1);
      atualizarListaVisual();
    }

    function atualizarListaVisual() {
      const container = document.getElementById('commandList');
      container.innerHTML = '';
      const lista = dadosBots[slotAtual].comandos;

      if (lista.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); font-size: 12px; text-align: center; padding: 10px;">Nenhum comando de barra criado neste slot ainda.</p>';
        return;
      }

      lista.forEach((cmd, index) => {
        let badgeText = 'Texto Slash';
        let badgeColor = 'var(--success)';
        let borderClass = '';

        if (cmd.type === 'ai') {
          badgeText = `IA: ${cmd.aiModel}`;
          badgeColor = 'var(--ai-color)';
          borderClass = 'ai-border';
        } else if (cmd.type === 'code') {
          badgeText = 'Script JS';
          badgeColor = 'var(--code-color)';
          borderClass = 'code-border';
        }

        container.innerHTML += `
          <div class="cmd-item ${borderClass}">
            <h4>/${cmd.name}</h4>
            <p>${cmd.description}</p>
            <div class="cmd-footer">
              <span class="cmd-badge" style="color: ${badgeColor}">${badgeText}</span>
              <button class="btn-del" onclick="removerComando(${index})">Excluir</button>
            </div>
          </div>
        `;
      });
    }

    function mostrarStatus(msg, cor) {
      const statusDiv = document.getElementById('status-msg');
      statusDiv.style.display = 'block';
      statusDiv.style.backgroundColor = cor === 'erro' ? 'rgba(239, 68, 68, 0.15)' : 'rgba(16, 185, 129, 0.15)';
      statusDiv.style.color = cor === 'erro' ? '#f87171' : '#34d399';
      statusDiv.innerText = msg;
    }

    async function salvarELigar() {
      const token = document.getElementById('botToken').value.trim();
      dadosBots[slotAtual].token = token;

      if (!token) return mostrarStatus('Insira o token do bot antes de ligar!', 'erro');

      mostrarStatus(`Conectando o ${slotAtual} e registrando comandos slash...`, 'ok');

      try {
        const res = await fetch(`${API_URL}/api/bot/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            botId: slotAtual,
            token: token,
            customCommands: dadosBots[slotAtual].comandos
          })
        });
        const data = await res.json();
        
        if (data.success) {
          mostrarStatus(`[OK] ${data.message}`, 'ok');
        } else {
          mostrarStatus(`[Erro] ${data.message}`, 'erro');
        }
      } catch (err) {
        mostrarStatus("[Erro] Falha de comunicacao com o servidor.", 'erro');
      }
    }

    async function desligarBot() {
      mostrarStatus(`Desligando ${slotAtual}...`, 'ok');
      try {
        const res = await fetch(`${API_URL}/api/bot/stop`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ botId: slotAtual })
        });
        const data = await res.json();
        mostrarStatus(`[OK] ${data.message}`, 'ok');
      } catch (err) {
        mostrarStatus("[Erro] Erro ao comunicar com o servidor.", 'erro');
      }
    }
  </script>
</body>
            </html>
