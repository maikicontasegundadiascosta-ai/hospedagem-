<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Hospedagem de Bots</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #0f172a; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }
        .card { 
            background: #1e293b; 
            padding: 35px 25px; 
            border-radius: 16px; 
            text-align: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
            width: 100%; 
            max-width: 400px; 
        }
        h2 { margin-top: 0; margin-bottom: 10px; font-size: 24px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .btn { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 15px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-discord { background: #5865F2; color: #fff; }
        .btn-discord svg { width: 20px; height: 20px; fill: currentColor; }
        .btn-danger { background: #ef4444; color: #fff; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Painel de Bots</h2>
        <p id="status-text">Faça login para gerenciar sua hospedagem:</p>

        <!-- Botão do Discord com Ícone SVG -->
        <div id="auth-buttons">
            <button class="btn btn-discord" onclick="logarComDiscord()">
                <svg viewBox="0 0 127.14 96.36">
                    <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.15c2.63-27.29-4.53-51.19-19.45-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.88,53,48.71,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.18-12.72,11.44-12.72S96.15,46,96.13,53,91,65.69,84.69,65.69Z"/>
                </svg>
                Entrar com o Discord
            </button>
        </div>

        <!-- Área do usuário logado -->
        <div id="user-info" class="hidden">
            <p id="user-email" style="color: #38bdf8; font-weight: bold; word-break: break-all;"></p>
            <button class="btn btn-danger" onclick="sair()">Sair</button>
        </div>
    </div>

    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://aiilbyqilfrtaytryyyx.supabase.co';
        const supabaseKey = 'sb_publishable_ZI3DUJuIf7Fd50Lyo_6GcQ_lH2E93xw';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function logarComDiscord() {
            const { error } = await _supabase.auth.signInWithOAuth({
                provider: 'discord',
                options: {
                    redirectTo: window.location.origin + window.location.pathname
                }
            });
            if (error) alert('Erro ao autenticar: ' + error.message);
        }

        async function verificarSessao() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                document.getElementById('auth-buttons').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('status-text').innerText = 'Sessão ativa:';
                document.getElementById('user-email').innerText = session.user.user_metadata.full_name || session.user.email;
            }
        }

        async function sair() {
            await _supabase.auth.signOut();
            window.location.reload();
        }

        verificarSessao();
    </script>
</body>
</html>
