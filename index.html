<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel - Hospedagem de Bots</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 350px; }
        .btn { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; }
        .btn-discord { background: #5865F2; color: #fff; }
        .btn-google { background: #ffffff; color: #333; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Painel de Bots</h2>
        <p id="status-text">Faça login para continuar:</p>

        <!-- Botões de Login -->
        <div id="auth-buttons">
            <button class="btn btn-discord" onclick="logarCom('discord')">
                Entrar com o Discord
            </button>
            <button class="btn btn-google" onclick="logarCom('google')">
                Entrar com o Gmail
            </button>
        </div>

        <!-- Área do usuário logado (inicialmente oculta) -->
        <div id="user-info" class="hidden">
            <p id="user-email" style="color: #38bdf8; font-weight: bold;"></p>
            <button class="btn" style="background: #ef4444; color: #fff;" onclick="sair()">Sair</button>
        </div>
    </div>

    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://aiilbyqilfrtaytryyyx.supabase.co';
        const supabaseKey = 'sb_publishable_ZI3DUJuIf7Fd50Lyo_6GcQ_lH2E93xw';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function logarCom(provedor) {
            const { error } = await _supabase.auth.signInWithOAuth({
                provider: provedor,
                options: {
                    redirectTo: window.location.origin
                }
            });
            if (error) alert('Erro ao autenticar: ' + error.message);
        }

        async function verificarSessao() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                document.getElementById('auth-buttons').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('status-text').innerText = 'Logado com sucesso!';
                document.getElementById('user-email').innerText = session.user.email || session.user.user_metadata.full_name;
            }
        }

        async function sair() {
            await _supabase.auth.signOut();
            window.location.reload();
        }

        verificarSessao();
    </script>
</body>
</html>
