<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Controle - Bots</title>
  <style>
    :root {
      --bg-base: #090a0f;
      --bg-card: #131722;
      --bg-input: #0b0e14;
      --border: #1e2638;
      --text-main: #f1f5f9;
      --text-muted: #8c9bae;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --ai-color: #ec4899;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg-base); 
      color: var(--text-main); 
      padding: 16px;
      padding-bottom: 90px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .top-header { 
      text-align: center; 
      margin-bottom: 20px; 
      padding-top: 8px;
    }
    .top-header h1 { 
      font-size: 18px; 
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.2px;
    }
    .top-header p { 
      color: var(--text-muted); 
      font-size: 11px; 
      margin-top: 3px; 
    }

    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.2s ease-in-out; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card { 
      background: var(--bg-card); 
      border-radius: 12px; 
      padding: 16px; 
      margin-bottom: 12px; 
      border: 1px solid var(--border); 
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.4);
    }
    
    .card-title { 
      font-size: 13px; 
      color: #fff; 
      margin-bottom: 12px; 
      font-weight: 600; 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .field { margin-bottom: 12px; }
    
    label { 
      display: block; 
      margin-bottom: 5px; 
      font-size: 10px; 
      font-weight: 700; 
      color: var(--text-muted); 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
    }
    
    input, select, textarea { 
      width: 100%; 
      padding: 10px 12px; 
      background: var(--bg-input); 
      border: 1px solid var(--border); 
      color: var(--text-main); 
      border-radius: 8px; 
      font-size: 13px; 
      outline: none; 
      transition: all 0.2s;
    }
    
    input:focus, select:focus, textarea:focus { 
      border-color: var(--primary); 
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    textarea {
      font-family: 'Fira Code', monospace, sans-serif;
      font-size: 12px;
      resize: vertical;
    }

    .section-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }

    .btn { 
      padding: 11px; 
      border: none; 
      border-radius: 8px; 
      font-size: 13px; 
      font-weight: 600; 
      cursor: pointer; 
      color: white; 
      width: 100%; 
      transition: all 0.2s; 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
    }
    
    .btn-primary { background: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    
    .btn-success { background: var(--success); }
    .btn-success:hover { opacity: 0.9; }
    
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { opacity: 0.9; }

    .btn-test { 
      background: rgba(245, 158, 11, 0.1); 
      border: 1px solid rgba(245, 158, 11, 0.3); 
      color: #fbbf24; 
      margin-bottom: 8px; 
    }
    .btn-test:hover { background: rgba(245, 158, 11, 0.2); }
    
    .cmd-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    
    .cmd-card { 
      background: var(--bg-input); 
      border: 1px solid var(--border); 
      border-radius: 8px; 
      padding: 10px 12px; 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .cmd-info h4 { color: #fff; font-size: 12px; font-family: monospace; font-weight: 600; margin-bottom: 2px; }
    
    .badge { 
      padding: 2px 5px; 
      background: rgba(255,255,255,0.06); 
      border-radius: 4px; 
      font-size: 9px; 
      font-weight: 700; 
      text-transform: uppercase;
      color: var(--text-muted);
    }
    
    .btn-del { 
      background: transparent; 
      color: var(--danger); 
      border: 1px solid rgba(239, 68, 68, 0.3); 
      padding: 5px 8px; 
      font-size: 11px; 
      border-radius: 6px;
      width: auto;
      cursor: pointer;
    }
    .btn-del:hover { background: rgba(239, 68, 68, 0.1); }

    .btn-clear-all {
      background: transparent;
      color: var(--danger);
      font-size: 10px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      text-transform: uppercase;
    }
    .btn-clear-all:hover { text-decoration: underline; }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: rgba(13, 17, 23, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid var(--border);
      z-index: 1000;
    }
    
    .nav-btn {
      text-align: center;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
      flex: 1;
      transition: color 0.2s;
    }
    
    .nav-btn.active { color: var(--primary); }

    .alert-msg { 
      margin-top: 10px; 
      padding: 9px; 
      border-radius: 6px; 
      display: none; 
      font-weight: 500; 
      text-align: center; 
      font-size: 11px; 
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-header">
      <h1>Painel de Hospedagem</h1>
      <p>Gerenciamento de slots e comandos</p>
    </div>

    <!-- TELA 1: BOTS -->
    <div id="dashboard" class="screen active">
      <div class="card">
        <div class="field">
          <label>Slot Ativo</label>
          <select id="selectedBotSlot" onchange="mudarSlotBot()">
            <option value="bot-1">Slot de Bot [ 1 ]</option>
            <option value="bot-2">Slot de Bot [ 2 ]</option>
            <option value="bot-3">Slot de Bot [ 3 ]</option>
            <option value="bot-4">Slot de Bot [ 4 ]</option>
          </select>
        </div>

        <div class="card-title" id="slotTitle" style="color: var(--primary);">Configurando: Slot 1</div>
        
        <div class="field">
          <label>Token do Discord</label>
          <input type="password" id="botToken" placeholder="Cole o token do bot aqui..." oninput="salvarTokenDigitado()">
        </div>
        
        <button class="btn btn-success" onclick="salvarELigar()">Ligar / Atualizar Bot</button>
        <button class="btn btn-danger" onclick="desligarBot()">Desligar Slot</button>
        
        <div id="status-msg" class="alert-msg"></div>
      </div>
    </div>

    <!-- TELA 2: COMANDOS -->
    <div id="commands" class="screen">
      <div class="card">
        <div class="card-title" id="cmdSlotTitle">Novo Comando Slash (Slot 1)</div>
        
        <div class="field">
          <label>Nome do Comando</label>
          <input type="text" id="cmdName" placeholder="/exemplo">
        </div>

        <!-- Opção 1: Script JS -->
        <div class="section-box">
          <div class="field" style="margin-bottom: 0;">
            <label>Script JavaScript (Opcional)</label>
            <textarea id="cmdScript" rows="3" placeholder="const lat = Date.now() - interaction.createdTimestamp;&#10;return `Pong! Latência: ${lat}ms`;" style="margin-top: 5px;"></textarea>
          </div>
        </div>

        <!-- Opção 2: API de IA (Recomendado Groq) -->
        <div class="section-box" style="border-color: rgba(236, 72, 153, 0.3);">
          <div class="field">
            <label style="color: var(--ai-color);">API de IA - Recomendado Groq (Opcional)</label>
            <input type="password" id="aiKey" placeholder="Cole sua chave da API (Ex: gsk_...)" style="margin-top: 5px;">
          </div>
          <div class="field" style="margin-bottom: 0;">
            <label style="color: var(--text-muted); font-size: 9px;">Modelo (Ex: llama-3.3-70b-versatile)</label>
            <input type="text" id="aiModel" value="llama-3.3-70b-versatile" style="margin-top: 3px;">
          </div>
        </div>

        <button class="btn btn-primary" onclick="adicionarComando()">Adicionar Comando</button>
      </div>

      <div class="card">
        <div class="card-title">
          <span>Comandos Configurados</span>
          <button class="btn-clear-all" onclick="limparTodosComandos()">Limpar Todos</button>
        </div>
        <div id="commandList" class="cmd-list"></div>
      </div>
    </div>

    <!-- TELA 3: TESTES -->
    <div id="tests" class="screen">
      <div class="card">
        <div class="card-title">Injetor Rápido de Testes</div>
        <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 12px;">
          Adicione scripts prontos instantaneamente no slot atual.
        </p>

        <button class="btn btn-test" onclick="injetarTeste('ping')">Injetar /ping (Latência)</button>
        <button class="btn btn-test" onclick="injetarTeste('sorteio')">Injetar /sorteio (Aleatório)</button>

        <div id="test-msg" class="alert-msg"></div>
      </div>
    </div>

    <!-- MENU INFERIOR -->
    <div class="nav-bar">
      <div class="nav-btn active" onclick="switchTab('dashboard', this)">Bots</div>
      <div class="nav-btn" onclick="switchTab('commands', this)">Comandos</div>
      <div class="nav-btn" onclick="switchTab('tests', this)">Testes</div>
    </div>
  </div>

  <script>
    const API_URL = "https://hospedagem-wfd0.onrender.com";
    
    let dadosBots = JSON.parse(localStorage.getItem('daos_hospedagem_bots')) || {
      'bot-1': { token: '', comandos: [] },
      'bot-2': { token: '', comandos: [] },
      'bot-3': { token: '', comandos: [] },
      'bot-4': { token: '', comandos: [] }
    };
    
    let slotAtual = 'bot-1';

    document.getElementById('botToken').value = dadosBots['bot-1'].token || '';
    atualizarListaVisual();

    function salvarNoLocalStorage() {
      localStorage.setItem('daos_hospedagem_bots', JSON.stringify(dadosBots));
    }

    function salvarTokenDigitado() {
      const token = document.getElementById('botToken').value.trim();
      dadosBots[slotAtual].token = token;
      salvarNoLocalStorage();
    }

    function switchTab(tabId, element) {
      document.querySelectorAll('.screen').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(nav => nav.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      element.classList.add('active');
    }

    function mudarSlotBot() {
      slotAtual = document.getElementById('selectedBotSlot').value;
      const num = slotAtual.replace('bot-', '');
      document.getElementById('slotTitle').innerText = `Configurando: Slot ${num}`;
      document.getElementById('cmdSlotTitle').innerText = `Novo Comando Slash (Slot ${num})`;
      document.getElementById('botToken').value = dadosBots[slotAtual].token || '';
      atualizarListaVisual();
    }

    function adicionarComando() {
      let rawName = document.getElementById('cmdName').value.trim().toLowerCase();
      if (!rawName) return alert('Digite o nome do comando!');
      const name = rawName.startsWith('/') ? rawName : '/' + rawName;
      
      const scriptCode = document.getElementById('cmdScript').value.trim();
      const aiKey = document.getElementById('aiKey').value.trim();
      const aiModel = document.getElementById('aiModel').value.trim();

      let type = 'code';
      if (aiKey) type = 'ai';

      const novoCmd = {
        name,
        description: `Comando ${name}`,
        type,
        response: null,
        scriptCode: scriptCode || null,
        aiKey: aiKey || null,
        aiModel: aiModel || 'llama-3.3-70b-versatile'
      };

      dadosBots[slotAtual].comandos.push(novoCmd);
      salvarNoLocalStorage();
      atualizarListaVisual();
      
      document.getElementById('cmdName').value = '';
      document.getElementById('cmdScript').value = '';
      document.getElementById('aiKey').value = '';

      alert(`Comando ${name} adicionado com sucesso!`);
    }

    function injetarTeste(tipo) {
      let cmdObj = tipo === 'ping' ? {
        name: '/ping', type: 'code', scriptCode: 'const lat = Date.now() - interaction.createdTimestamp;\nreturn `Pong! Latência: ${lat}ms`;'
      } : {
        name: '/sorteio', type: 'code', scriptCode: 'const num = Math.floor(Math.random() * 100) + 1;\nreturn `Sorteio: ${num}`;'
      };

      if (!dadosBots[slotAtual].comandos.some(c => c.name === cmdObj.name)) {
        dadosBots[slotAtual].comandos.push(cmdObj);
        salvarNoLocalStorage();
        atualizarListaVisual();
        const msg = document.getElementById('test-msg');
        msg.style.display = 'block';
        msg.style.background = 'rgba(16, 185, 129, 0.15)';
        msg.style.color = '#34d399';
        msg.innerText = `Injetado ${cmdObj.name} com sucesso!`;
        setTimeout(() => msg.style.display = 'none', 3000);
      } else {
        alert(`O comando ${cmdObj.name} já existe neste slot.`);
      }
    }

    function removerComando(index) {
      dadosBots[slotAtual].comandos.splice(index, 1);
      salvarNoLocalStorage();
      atualizarListaVisual();
    }

    function limparTodosComandos() {
      if (confirm('Tem certeza que deseja apagar todos os comandos deste slot?')) {
        dadosBots[slotAtual].comandos = [];
        salvarNoLocalStorage();
        atualizarListaVisual();
      }
    }

    function atualizarListaVisual() {
      const container = document.getElementById('commandList');
      container.innerHTML = '';
      const lista = dadosBots[slotAtual].comandos;

      if (lista.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); font-size: 11px; text-align: center; padding: 4px;">Nenhum comando configurado.</p>';
        return;
      }

      lista.forEach((cmd, index) => {
        container.innerHTML += `
          <div class="cmd-card">
            <div class="cmd-info">
              <h4>${cmd.name}</h4>
              <span class="badge">${cmd.type.toUpperCase()}</span>
            </div>
            <button class="btn-del" onclick="removerComando(${index})">Excluir</button>
          </div>
        `;
      });
    }

    function mostrarStatus(text, type) {
      const box = document.getElementById('status-msg');
      box.style.display = 'block';
      box.style.background = type === 'erro' ? 'rgba(239, 68, 68, 0.15)' : 'rgba(16, 185, 129, 0.15)';
      box.style.color = type === 'erro' ? '#f87171' : '#34d399';
      box.innerText = text;
    }

    async function salvarELigar() {
      const token = document.getElementById('botToken').value.trim();
      dadosBots[slotAtual].token = token;
      salvarNoLocalStorage();

      if (!token) return mostrarStatus('Insira o token do bot!', 'erro');

      mostrarStatus('Conectando e sincronizando...', 'ok');
      try {
        const res = await fetch(`${API_URL}/api/bot/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ botId: slotAtual, token, customCommands: dadosBots[slotAtual].comandos })
        });
        const data = await res.json();
        mostrarStatus(data.message, data.success ? 'ok' : 'erro');
      } catch {
        mostrarStatus('Erro de conexão com o servidor.', 'erro');
      }
    }

    async function desligarBot() {
      mostrarStatus('Desligando...', 'ok');
      try {
        const res = await fetch(`${API_URL}/api/bot/stop`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ botId: slotAtual })
        });
        const data = await res.json();
        mostrarStatus(data.message, 'ok');
      } catch {
        mostrarStatus('Erro ao desligar.', 'erro');
      }
    }
  </script>
</body>
  </html>
